# Name the report after the project so the heading distinguishes it from a generic
# "Serenity BDD Report" (the default when this is unset).
serenity.project.name=ParaBank Bank Automation

# Serenity 4.3.4 renders CSV download controls on filtered report views. Generate the
# linked exports so every public navigation target is complete and independently scanned.
serenity.generate.csv.reports=true

# Cucumber feature requirements already have full living-documentation pages. Exclude
# their duplicate tag-cloud views, which Serenity 4.3.4 links but does not generate.
serenity.report.exclude.tags=feature:*
