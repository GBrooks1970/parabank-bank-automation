# CI: build the ParaBank SUT from the pinned upstream commit, boot it to a verified
# state (boot gate), then run the test lanes via the single verify entry point.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sut-boot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build SUT image (pinned upstream, containerised Maven)
        shell: pwsh
        run: ./scripts/build-sut.ps1

      - name: Start ParaBank
        run: docker compose up -d

      - name: Boot gate (UI/REST, OpenAPI, SOAP, initializeDB)
        shell: pwsh
        run: ./scripts/gate.ps1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install test toolchain
        run: npm ci

      - name: Verify (typecheck + tag lint + API lane)
        run: npm run verify

      - name: SUT logs on failure
        if: failure()
        run: docker logs parabank || true

      - name: Teardown
        if: always()
        run: docker compose down
