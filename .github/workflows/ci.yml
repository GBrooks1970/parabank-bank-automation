# CI: build the ParaBank SUT from the pinned upstream commit, boot it to a verified
# state (boot gate), then run both test lanes (API + Serenity/JS UI) and the Serenity
# report generation/content check via the single `npm run verify` entry point.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sut-boot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build SUT image (pinned upstream, containerised Maven)
        shell: pwsh
        run: ./scripts/build-sut.ps1

      - name: Start ParaBank
        run: docker compose up -d

      - name: Boot gate (UI/REST, OpenAPI, SOAP, initializeDB)
        shell: pwsh
        run: ./scripts/gate.ps1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java (Serenity BDD report generator)
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install test toolchain
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Verify (typecheck, tag lint, smoke-safety, API + UI lanes, Serenity report)
        run: npm run verify

      - name: Prepare and validate static Pages evidence
        env:
          SOURCE_REF: ${{ github.sha }}
        run: |
          npm run prepare:pages -- --source-ref "$SOURCE_REF"
          npm run check:pages -- --source-ref "$SOURCE_REF"

      - name: Upload verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages
          include-hidden-files: true

      - name: Serenity report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serenity-report
          path: target/site/serenity
          if-no-files-found: ignore

      - name: SUT logs on failure
        if: failure()
        run: docker logs parabank || true

      - name: Teardown
        if: always()
        run: docker compose down

  deploy-pages:
    name: Deploy GitHub Pages
    needs: sut-boot-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.sut-boot-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy verified evidence
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
